apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-staging
  namespace: argocd
spec:
  project: default
  source:
    chart: metallb
    repoURL: https://metallb.github.io/metallb
    targetRevision: 0.14.3
  destination:
    server: https://192.168.98.20:6443
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
